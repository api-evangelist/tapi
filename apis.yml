aid: tapi
name: Tapi
description: >-
  Tapi (tapi.la) is the leading payment network in Latin America, founded in 2022.
  It provides embeddable financial infrastructure — bill and service payments,
  cash-in/cash-out, phone and airtime recharges, digital gift cards and PINs, and
  scheduled/recurring payments — that fintechs, banks and neobanks integrate through
  a single regional API. Tapi operates across Argentina, Chile, Colombia, Mexico and
  Peru, exposing a directory of thousands of billers plus Services, Recharges,
  Subscriptions and Agenda products, with asynchronous operation-status polling and
  webhook notifications, behind a token-based Login service. tapi_pay extends the
  network into payment acceptance.
